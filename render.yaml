# render.yaml — one-click deploy config for Render (https://render.com)
#
# To deploy:
#   1. Push this repo to GitHub
#   2. On Render: New + → Blueprint → connect this repo
#   3. Render reads this file and deploys automatically
#
# The free tier spins down after inactivity; first request after idle
# takes ~30s to wake. Fine for a portfolio demo.

services:
  - type: web
    name: blr-rental-predictor
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
